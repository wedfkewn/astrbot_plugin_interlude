<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Interlude · 故事总览</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="shell">
    <header class="page-header">
      <div>
        <p class="eyebrow">INTERLUDE / STORY CONTROL</p>
        <h1>故事总览</h1>
        <p class="subtitle">查看角色正在经历什么，以及故事接下来会发生什么。</p>
      </div>
      <button id="refresh" class="refresh-button" type="button" aria-label="刷新故事数据">↻ <span>刷新数据</span></button>
    </header>
    <nav class="page-nav" aria-label="Interlude 页面">
      <a class="active" aria-current="page" href="#/dashboard" data-view="dashboard">总览</a>
      <a href="#/story" data-view="story">故事</a>
      <a href="#/memory" data-view="memory">记忆</a>
      <a href="#/schedule" data-view="schedule">日程</a>
    </nav>
    <section class="toolbar" aria-label="浏览选项">
      <label class="field story-field" for="story"><span>当前故事</span><select id="story" aria-label="当前故事"></select></label>
      <label class="field search-field" for="filter"><span>查找事件</span><input id="filter" type="search" placeholder="搜索最近事件" autocomplete="off"></label>
      <span id="story-count" class="story-count" aria-live="polite"></span>
    </section>
    <div id="content" aria-live="polite"></div>
    <footer>Interlude · 持续生活叙事</footer>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
